[package]
name = "clash-traffic"
version = "2.0.0"
edition = "2021"
authors = ["Weicoz"]
description = "Clash-compatible read-only traffic accounting and live tables (Native Rust)"

[[bin]]
name = "clash-traffic"
path = "src_rs/main.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.9", default-features = false, features = ["tls", "json"] }
crossterm = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
